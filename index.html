<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooftop Scramble</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #2a2238;
        --cream: #fff6e0;
        /* Enamel street-sign colours, matching the town. */
        --enamel: #1d3a6e;
        --enamel-white: #f6f3ec;
        --slate: #1c2028;
        --stone: #e9e2d4;
        --gilt: #d9ab4f;
        --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
      }
      kbd {
        display: inline-block;
        min-width: 1.4em;
        padding: 0.1em 0.45em;
        border-radius: 0.3em;
        background: var(--enamel-white);
        color: var(--slate);
        font: 700 0.85em/1.3 'Atkinson Hyperlegible', system-ui, sans-serif;
        text-align: center;
        box-shadow: inset 0 -0.15em 0 rgb(28 32 40 / 0.25);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .outlined {
        color: #fff;
        -webkit-text-stroke: 0.08em var(--ink);
        paint-order: stroke fill;
      }

      /* Lobby: a quiet column down the left, leaving the town flythrough visible on the right. */
      #lobby {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(1.25rem, 3.5vh, 2.25rem);
        padding: clamp(1.5rem, 5vh, 3.5rem) clamp(1rem, 5vw, 4.5rem);
        color: var(--enamel-white);
        background: linear-gradient(90deg, rgb(20 24 32 / 0.82) 0%, rgb(20 24 32 / 0.55) 34rem, rgb(20 24 32 / 0) 52rem);
      }
      #lobby[hidden] {
        display: none;
      }
      #lobby > * {
        width: min(32rem, 100%);
      }
      #lobby header h1 {
        margin: 0;
        font: 900 clamp(3rem, 9vw, 5.6rem) / 0.86 var(--display);
        letter-spacing: -0.01em;
        text-shadow: 0 0.04em 0.4em rgb(0 0 0 / 0.35);
      }
      #lobby header p {
        margin: 0.6rem 0 0;
        font-size: 1.1rem;
        color: rgb(246 243 236 / 0.8);
      }

      /* The course name is an enamel street plate: the one loud thing on the screen. */
      #course {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 0.75rem;
      }
      .plate {
        position: relative;
        padding: 0.7rem 1.2rem 0.75rem;
        border-radius: 0.6rem;
        background: linear-gradient(180deg, rgb(255 255 255 / 0.16), rgb(255 255 255 / 0) 55%), var(--enamel);
        box-shadow:
          inset 0 0 0 0.28rem var(--enamel),
          inset 0 0 0 0.45rem var(--enamel-white),
          0 0.6rem 1.6rem rgb(0 0 0 / 0.35);
        text-align: center;
        font: 800 clamp(2rem, 5vw, 2.8rem) / 1 var(--display);
        letter-spacing: 0.01em;
      }
      .plate small {
        position: absolute;
        top: -0.65rem;
        right: 1rem;
        padding: 0.05rem 0.5rem;
        border-radius: 0.3rem;
        background: var(--gilt);
        color: var(--slate);
        font: 700 0.8rem/1.4 'Atkinson Hyperlegible', system-ui, sans-serif;
        letter-spacing: 0;
      }
      #course button {
        width: 2.6rem;
        height: 2.6rem;
        border: 0;
        border-radius: 50%;
        background: rgb(246 243 236 / 0.12);
        color: var(--enamel-white);
        font-size: 1rem;
        cursor: pointer;
      }
      #course button:hover {
        background: rgb(246 243 236 / 0.25);
      }
      #course button:focus-visible {
        outline: 2px solid var(--gilt);
        outline-offset: 2px;
      }
      #course p {
        grid-column: 2;
        margin: 0;
        text-align: center;
        color: rgb(246 243 236 / 0.85);
      }

      /* Players: each joined player gets a house-number plaque in their colour. */
      #slots {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.5rem;
      }
      .slot {
        display: grid;
        grid-template-columns: 2.6rem 1fr;
        column-gap: 0.9rem;
        align-items: center;
        min-height: 2.6rem;
      }
      .slot > b {
        grid-row: span 2;
        display: grid;
        place-items: center;
        height: 2.6rem;
        border-radius: 0.4rem;
        background: var(--c);
        box-shadow: inset 0 0 0 0.16rem rgb(255 255 255 / 0.7);
        font: 900 1.7rem/1 var(--display);
        color: #fff;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
      }
      .slot span {
        font-weight: 700;
      }
      .slot small {
        color: rgb(246 243 236 / 0.75);
        font-size: 0.85rem;
      }
      .slot small kbd {
        font-size: 0.75rem;
      }
      .slot.empty > b {
        background: none;
        box-shadow: inset 0 0 0 0.12rem rgb(246 243 236 / 0.35);
        color: rgb(246 243 236 / 0.45);
        text-shadow: none;
      }
      .slot.empty span {
        grid-row: span 2;
        font-weight: 400;
        color: rgb(246 243 236 / 0.5);
      }
      /* Only the next free slot asks for attention. */
      .slot.empty.next span {
        color: var(--enamel-white);
        animation: beckon 1.6s ease-in-out infinite;
      }
      @keyframes beckon {
        50% {
          opacity: 0.45;
        }
      }
      #cpu {
        margin: 0.9rem 0 0;
        color: rgb(246 243 236 / 0.75);
      }
      .keys {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.4rem;
        color: rgb(246 243 236 / 0.8);
        font-size: 0.95rem;
      }
      .keys kbd + kbd {
        margin-left: 0.25em;
      }
      .keys kbd {
        margin-right: 0.35em;
      }
      @media (prefers-reduced-motion: reduce) {
        .slot.empty.next span {
          animation: none;
        }
      }
      @media (max-height: 560px) {
        #lobby header p,
        .keys {
          display: none;
        }
      }

      /* In-race HUD, one per viewport */
      .hud {
        position: absolute;
        overflow: hidden;
        color: #fff;
      }
      .hud-name {
        position: absolute;
        left: 1em;
        top: 1em;
        font-size: 1.6em;
        font-weight: bold;
        color: var(--player);
        -webkit-text-stroke: 0.15em var(--ink);
        paint-order: stroke fill;
      }
      .hud-place {
        position: absolute;
        right: 0.6em;
        bottom: 0.2em;
        font-size: 6em;
        font-weight: bold;
        -webkit-text-stroke: 0.06em var(--ink);
        paint-order: stroke fill;
        line-height: 1;
      }
      .hud-place sup {
        font-size: 0.4em;
      }
      .hud-place span {
        font-size: 0.3em;
      }
      .hud-item {
        position: absolute;
        left: 1em;
        top: 3.4em;
        width: 2.2em;
        height: 2.2em;
        font-size: 2.4em;
        display: grid;
        place-items: center;
        background: rgb(255 246 224 / 0.85);
        border: 0.12em solid var(--ink);
        border-radius: 0.4em;
      }
      .hud-item.ready {
        animation: wiggle 0.6s infinite;
        background: #ffd86b;
      }
      @keyframes wiggle {
        25% {
          transform: rotate(-6deg) scale(1.05);
        }
        75% {
          transform: rotate(6deg) scale(1.05);
        }
      }
      .hud-timer {
        position: absolute;
        right: 1em;
        top: 0.8em;
        font-size: 2em;
        font-weight: bold;
        -webkit-text-stroke: 0.12em var(--ink);
        paint-order: stroke fill;
        font-variant-numeric: tabular-nums;
      }
      .hud-track {
        position: absolute;
        left: 15%;
        right: 15%;
        top: 1.6em;
        height: 0.5em;
        background: rgb(255 246 224 / 0.8);
        border: 0.15em solid var(--ink);
        border-radius: 1em;
      }
      .hud-track::after {
        content: '🏁';
        position: absolute;
        right: -1.4em;
        top: -0.65em;
        font-size: 1.3em;
      }
      .hud-dot {
        position: absolute;
        top: 50%;
        width: 0.9em;
        height: 0.9em;
        border-radius: 50%;
        border: 0.12em solid var(--ink);
        transform: translate(-50%, -50%);
        transition: left 0.2s linear;
      }
      .hud-dot.self {
        width: 1.5em;
        height: 1.5em;
        z-index: 1;
      }
      .hud-message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 6em;
        font-weight: bold;
        color: #ffd86b;
        -webkit-text-stroke: 0.05em var(--ink);
        paint-order: stroke fill;
        text-align: center;
      }
      .hud-message.pop {
        animation: pop 0.4s cubic-bezier(0.3, 1.8, 0.5, 1);
      }
      @keyframes pop {
        from {
          transform: scale(0.2);
        }
      }
      .hud-effect {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 1.5em;
        text-align: center;
        font-size: 2.2em;
        font-weight: bold;
        -webkit-text-stroke: 0.1em var(--ink);
        paint-order: stroke fill;
      }
      .hud-pigeons {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .hud-pigeons.active {
        opacity: 1;
      }
      .hud-pigeons span {
        position: absolute;
        animation: flap 0.25s infinite alternate, drift 2s infinite ease-in-out alternate;
      }
      @keyframes flap {
        to {
          transform: scaleY(0.6) rotate(-10deg);
        }
      }
      @keyframes drift {
        to {
          translate: 3em -2em;
        }
      }

      .results {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem clamp(1rem, 5vw, 4.5rem);
        background: linear-gradient(90deg, rgb(20 24 32 / 0.85) 0%, rgb(20 24 32 / 0.6) 30rem, rgb(20 24 32 / 0.1) 50rem);
        color: var(--enamel-white);
        pointer-events: none;
      }
      .results > * {
        width: min(28rem, 100%);
      }
      .results h1 {
        margin: 0;
        font: 900 clamp(3rem, 8vw, 4.6rem) / 0.9 var(--display);
      }
      .results ol {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.4rem;
      }
      .results li {
        display: grid;
        grid-template-columns: 2.4rem 1fr auto;
        align-items: center;
        gap: 0.9rem;
        padding: 0.45rem 0.9rem 0.45rem 0.45rem;
        border-radius: 0.5rem;
        background: rgb(246 243 236 / 0.08);
        font-size: 1.15rem;
      }
      .results li:first-child {
        background: rgb(217 171 79 / 0.22);
      }
      .results li b {
        display: grid;
        place-items: center;
        height: 2.4rem;
        border-radius: 0.35rem;
        background: var(--c);
        font: 900 1.5rem/1 var(--display);
        color: #fff;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
      }
      .results li em {
        font-style: normal;
        font-variant-numeric: tabular-nums;
      }
      .results li em.pending {
        color: rgb(246 243 236 / 0.55);
      }
      .results p {
        margin: 0;
        color: rgb(246 243 236 / 0.8);
      }
      .results p kbd {
        margin-right: 0.3em;
      }

      /* Training lesson card, bottom left of each player's view, clear of the place counter. */
      .hud-lesson {
        position: absolute;
        left: 1.4em;
        bottom: 1.4em;
        width: min(32em, 60%);
        padding: 0.8em 1.1em 0.9em;
        border-radius: 0.6em;
        background: rgb(20 24 32 / 0.78);
        color: var(--enamel-white);
        font-size: 1.15em;
        line-height: 1.4;
      }
      .hud-lesson[hidden] {
        display: none;
      }
      .hud-lesson small {
        float: right;
        color: rgb(246 243 236 / 0.6);
      }
      .hud-lesson b {
        display: block;
        font: 800 1.7em/1.1 var(--display);
        color: var(--gilt);
      }
      .hud-lesson p {
        margin: 0.25em 0 0;
      }
      .hud-lesson.enter {
        animation: lesson-in 0.35s ease-out;
      }
      @keyframes lesson-in {
        from {
          opacity: 0;
          translate: 0 0.8em;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-lesson.enter {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="lobby">
      <header>
        <h1>Rooftop Scramble</h1>
        <p>Parkour racing across town for up to four players.</p>
      </header>
      <section id="course" aria-label="Course"></section>
      <section aria-label="Players">
        <ol id="slots"></ol>
        <p id="cpu"></p>
      </section>
      <footer class="keys">
        <span><kbd>Jump</kbd> Join</span>
        <span><kbd>Item</kbd> Leave</span>
        <span><kbd>◀</kbd><kbd>▶</kbd> Change course</span>
        <span><kbd>Enter</kbd><kbd>Start</kbd> Race</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
