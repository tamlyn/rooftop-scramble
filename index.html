<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooftop Scramble</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>" />
    <style>
      :root {
        --ink: #2a2238;
        --cream: #fff6e0;
        font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .outlined {
        color: #fff;
        -webkit-text-stroke: 0.08em var(--ink);
        paint-order: stroke fill;
      }

      /* Lobby */
      #lobby {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        color: var(--ink);
        background: radial-gradient(circle at 50% 40%, rgb(255 246 224 / 0.25), rgb(42 34 56 / 0.45));
      }
      #lobby[hidden] {
        display: none;
      }
      #lobby h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 6rem);
        letter-spacing: 0.02em;
        color: #ffd86b;
        -webkit-text-stroke: 0.06em var(--ink);
        paint-order: stroke fill;
        transform: rotate(-3deg);
        text-shadow: 0.06em 0.08em 0 var(--ink);
      }
      #lobby .tagline {
        margin: -1rem 0 0;
        font-size: 1.2rem;
        font-weight: bold;
        color: #fff;
        -webkit-text-stroke: 0.15em var(--ink);
        paint-order: stroke fill;
      }
      #slots {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 13rem));
        gap: 1rem;
      }
      .slot {
        background: var(--cream);
        border: 4px solid var(--ink);
        border-radius: 1rem;
        padding: 1rem;
        min-height: 7rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        box-shadow: 0 6px 0 var(--ink);
        border-top: 1rem solid var(--c, #ccc);
      }
      .slot b {
        font-size: 1.6rem;
      }
      .slot small {
        opacity: 0.75;
        line-height: 1.3;
      }
      .slot.empty {
        opacity: 0.7;
        border-style: dashed;
        border-top-width: 4px;
      }
      .slot.empty span {
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }
      .lobby-help {
        background: var(--cream);
        border: 4px solid var(--ink);
        border-radius: 1rem;
        padding: 0.8rem 1.4rem;
        text-align: center;
        line-height: 1.6;
        box-shadow: 0 6px 0 var(--ink);
        max-width: 56rem;
      }
      .lobby-help kbd {
        background: var(--ink);
        color: var(--cream);
        border-radius: 0.3rem;
        padding: 0 0.4rem;
      }
      @media (max-width: 900px) {
        #slots {
          grid-template-columns: repeat(2, minmax(0, 13rem));
        }
      }

      /* In-race HUD, one per viewport */
      .hud {
        position: absolute;
        overflow: hidden;
        color: #fff;
      }
      .hud-name {
        position: absolute;
        left: 1em;
        top: 1em;
        font-size: 1.6em;
        font-weight: bold;
        color: var(--player);
        -webkit-text-stroke: 0.15em var(--ink);
        paint-order: stroke fill;
      }
      .hud-place {
        position: absolute;
        right: 0.6em;
        bottom: 0.2em;
        font-size: 6em;
        font-weight: bold;
        -webkit-text-stroke: 0.06em var(--ink);
        paint-order: stroke fill;
        line-height: 1;
      }
      .hud-place sup {
        font-size: 0.4em;
      }
      .hud-place span {
        font-size: 0.3em;
      }
      .hud-item {
        position: absolute;
        left: 1em;
        top: 3.4em;
        width: 2.2em;
        height: 2.2em;
        font-size: 2.4em;
        display: grid;
        place-items: center;
        background: rgb(255 246 224 / 0.85);
        border: 0.12em solid var(--ink);
        border-radius: 0.4em;
      }
      .hud-item.ready {
        animation: wiggle 0.6s infinite;
        background: #ffd86b;
      }
      @keyframes wiggle {
        25% {
          transform: rotate(-6deg) scale(1.05);
        }
        75% {
          transform: rotate(6deg) scale(1.05);
        }
      }
      .hud-timer {
        position: absolute;
        right: 1em;
        top: 0.8em;
        font-size: 2em;
        font-weight: bold;
        -webkit-text-stroke: 0.12em var(--ink);
        paint-order: stroke fill;
        font-variant-numeric: tabular-nums;
      }
      .hud-track {
        position: absolute;
        left: 15%;
        right: 15%;
        top: 1.6em;
        height: 0.5em;
        background: rgb(255 246 224 / 0.8);
        border: 0.15em solid var(--ink);
        border-radius: 1em;
      }
      .hud-track::after {
        content: '🏁';
        position: absolute;
        right: -1.4em;
        top: -0.65em;
        font-size: 1.3em;
      }
      .hud-dot {
        position: absolute;
        top: 50%;
        width: 0.9em;
        height: 0.9em;
        border-radius: 50%;
        border: 0.12em solid var(--ink);
        transform: translate(-50%, -50%);
        transition: left 0.2s linear;
      }
      .hud-dot.self {
        width: 1.5em;
        height: 1.5em;
        z-index: 1;
      }
      .hud-message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 6em;
        font-weight: bold;
        color: #ffd86b;
        -webkit-text-stroke: 0.05em var(--ink);
        paint-order: stroke fill;
        text-align: center;
      }
      .hud-message.pop {
        animation: pop 0.4s cubic-bezier(0.3, 1.8, 0.5, 1);
      }
      @keyframes pop {
        from {
          transform: scale(0.2);
        }
      }
      .hud-effect {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 1.5em;
        text-align: center;
        font-size: 2.2em;
        font-weight: bold;
        -webkit-text-stroke: 0.1em var(--ink);
        paint-order: stroke fill;
      }
      .hud-pigeons {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .hud-pigeons.active {
        opacity: 1;
      }
      .hud-pigeons span {
        position: absolute;
        animation: flap 0.25s infinite alternate, drift 2s infinite ease-in-out alternate;
      }
      @keyframes flap {
        to {
          transform: scaleY(0.6) rotate(-10deg);
        }
      }
      @keyframes drift {
        to {
          translate: 3em -2em;
        }
      }

      .results {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgb(42 34 56 / 0.6);
        color: var(--ink);
        pointer-events: none;
      }
      .results h1 {
        margin: 0 0 1rem;
        font-size: 4rem;
        color: #ffd86b;
        -webkit-text-stroke: 0.06em var(--ink);
        paint-order: stroke fill;
      }
      .results ol {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.5rem;
        min-width: 22rem;
      }
      .results li {
        display: grid;
        grid-template-columns: 2.5rem 1fr auto;
        align-items: center;
        gap: 1rem;
        background: var(--cream);
        border: 4px solid var(--ink);
        border-left: 1rem solid var(--c);
        border-radius: 0.8rem;
        padding: 0.5rem 1rem;
        font-size: 1.4rem;
      }
      .results p {
        color: #fff;
        font-weight: bold;
        -webkit-text-stroke: 0.15em var(--ink);
        paint-order: stroke fill;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="lobby">
      <h1>Rooftop Scramble</h1>
      <p class="tagline">Run, climb, tackle and rocket your way across town.</p>
      <div id="slots"></div>
      <div class="lobby-help">
        <div>Press <b>jump</b> to join (up to 4) · <b>item</b> to leave · <kbd>Enter</kbd> / <b>Start</b> to race</div>
        <div id="cpu"></div>
        <div>Run into walls to climb · jump at walls to grab ledges · jump off walls to wall-jump · dive into rivals to tackle</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
